<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin okno: NTS Delivery</title>
    <!-- Knihovna html5-qrcode (100% zdarma, lokální zpracování v prohlížeči bez omezení) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Knihovna Flatpickr pro spolehlivý kalendář a výběr času na všech zařízeních -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/cs.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            padding: 28px 24px;
            transition: all 0.3s ease;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        hr.divider {
            border: none;
            height: 2px;
            background: var(--border);
            margin: 18px 0;
        }

        h2.subtitle {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 28px;
        }

        .status-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .status-item.completed {
            background: #f0fdf4;
            border-color: #bbf7d0;
            font-weight: 700;
            color: #064e3b;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            background: #e2e8f0;
            color: transparent;
        }

        .status-item.completed .status-icon {
            background: var(--success);
            color: #ffffff;
        }

        .status-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .status-time-badge {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            background: #ffffff;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            white-space: nowrap;
            margin-top: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
            margin-bottom: 12px;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .hidden {
            display: none !important;
        }

        /* Obrazovka zadávání stavu */
        .action-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            user-select: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .checkbox-card:hover {
            border-color: #cbd5e1;
        }

        .checkbox-card input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-card span {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .datetime-wrapper {
            margin-bottom: 24px;
            animation: fadeIn 0.25s ease;
        }

        .datetime-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .datetime-display-box {
            position: relative;
            width: 100%;
        }

        .datetime-input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .datetime-input:hover, .datetime-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            outline: none;
        }

        .calendar-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Moderní vzhled vyskakovacího kalendáře Flatpickr */
        .flatpickr-calendar {
            font-family: 'Inter', sans-serif !important;
            border-radius: 14px !important;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15) !important;
            border: 1px solid var(--border) !important;
        }

        .flatpickr-day.selected, .flatpickr-day.selected:hover {
            background: var(--primary) !important;
            border-color: var(--primary) !important;
        }

        /* Sekce QR skeneru */
        .qr-subheading {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        .qr-Viewport {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--border);
            background: #000;
            margin-bottom: 16px;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #qr-reader {
            width: 100%;
        }

        .qr-warning {
            color: var(--danger);
            font-weight: 700;
            font-size: 1rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }

        .qr-success-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            text-align: center;
            animation: scaleUp 0.3s ease;
        }

        .big-checkmark {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.35);
            margin-bottom: 16px;
        }

        .loading-indicator {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .status-item {
                padding: 12px;
                flex-wrap: wrap;
            }
            .status-time-badge {
                margin-left: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- OBRAZOVKA 1: PŘEHLED STAVŮ -->
    <div class="container" id="overview-screen">
        <div class="header-top">
            <div class="header-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
            </div>
            <h1>Admin okno: NTS Delivery</h1>
        </div>
        <hr class="divider">
        <h2 class="subtitle">
            <span>Zásilka ID: 837-682-405</span>
        </h2>

        <div id="loading-state" class="loading-indicator">Načítání stavů z databáze...</div>

        <div id="status-list" class="status-list hidden"></div>

        <button id="btn-new-status" class="btn btn-primary hidden">Zadat nový stav</button>
    </div>

    <!-- OBRAZOVKA 2: ZADÁNÍ NOVÉHO STAVU -->
    <div class="container hidden" id="action-screen">
        <h1 id="action-heading" class="action-title"></h1>

        <!-- VARIANTA *1*: MANUÁLNÍ ZADÁNÍ -->
        <div id="manual-section" class="hidden">
            <label class="checkbox-card" for="chk-completed">
                <input type="checkbox" id="chk-completed">
                <span>Stav proběhl</span>
            </label>

            <div id="datetime-container" class="datetime-wrapper hidden">
                <span class="datetime-label">Vyberte datum a čas:</span>
                <div class="datetime-display-box">
                    <input type="text" id="datetime-picker-input" class="datetime-input" placeholder="Klikněte pro výběr (den.měsíc, hodina:minuta)" readonly>
                    <svg class="calendar-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
            </div>

            <button id="btn-save-manual" class="btn btn-success hidden">Uložit</button>
            <button id="btn-cancel-manual" class="btn btn-primary">Storno</button>
        </div>

        <!-- VARIANTA *2*: SKENOVÁNÍ QR KÓDU -->
        <div id="qr-section" class="hidden">
            <div id="qr-active-area">
                <h2 class="qr-subheading">Naskenujte QR kód:</h2>
                <div class="qr-Viewport">
                    <div id="qr-reader"></div>
                </div>
                <div id="qr-warning-msg" class="qr-warning hidden">
                    Varování: Nebyl naskenován platný QR kód
                </div>
                <button id="btn-cancel-qr" class="btn btn-primary" style="margin-top: 8px;">Storno</button>
            </div>

            <!-- ZELENÁ FAJFKA PO ÚSPĚŠNÉM SKENU NA 5 SEKUND -->
            <div id="qr-success-area" class="qr-success-box hidden">
                <div class="big-checkmark">
                    <svg width="56" height="56" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- VŠECHNY STAVY DOKONČENY (AŽ PO Q) -->
        <div id="all-done-section" class="hidden">
            <button id="btn-all-done" class="btn btn-primary">Hotovo</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzLLHPPZKUsa5HTlMBMn1I2eqc4DwY5_k",
            authDomain: "objednavka-3kabely.firebaseapp.com",
            databaseURL: "https://objednavka-3kabely-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "objednavka-3kabely",
            storageBucket: "objednavka-3kabely.firebasestorage.app",
            messagingSenderId: "295205729475",
            appId: "1:295205729475:web:cb2e3cd091a9a20df75e76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusesRef = ref(db, 'shipments/837-682-405/statuses');

        // Přesná definice kroků a jejich typů (*1* nebo *2*) a ID (A - Q)
        const STEPS = [
            { id: 'A', type: 1, title: 'Objednávka vytvořena (Alza.cz)' },
            { id: 'B', type: 1, title: 'Objednávka odeslána (Alza.cz)' },
            { id: 'C', type: 1, title: 'Objednávka dorazila do místního depa (Alza.cz), Kolej B.' },
            { id: 'D', type: 2, title: 'Zásilka zpracována (část 1/3), je na cestě' },
            { id: 'E', type: 2, title: 'Zásilka zpracována (část 2/3), je na cestě' },
            { id: 'F', type: 2, title: 'Zásilka zpracována (část 3/3), je na cestě' },
            { id: 'G', type: 2, title: 'Zásilka dorazila do našeho skladu (část 1/3), právě ji připravujeme pro doručení' },
            { id: 'H', type: 2, title: 'Zásilka dorazila do našeho skladu (část 2/3), právě ji připravujeme pro doručení' },
            { id: 'I', type: 2, title: 'Zásilka dorazila do našeho skladu (část 3/3), právě ji připravujeme pro doručení' },
            { id: 'J', type: 1, title: 'Změna odeslání zásilky - Zásilka nedorazila na správné depo, proto ji odešleme do lokálního depa' },
            { id: 'K', type: 2, title: 'Odesláno ze skladu' },
            { id: 'L', type: 2, title: 'Dorazila do Envelopa Hub Olomouc' },
            { id: 'M', type: 2, title: 'Předáno k převozu do cílového depa, sledovací číslo je: NB3304187862U' },
            { id: 'N', type: 1, title: 'Je v logistické síti / uzlu' },
            { id: 'O', type: 1, title: 'Naskladnění na depu Charváty' },
            { id: 'P', type: 2, title: 'Odesláno k Vám (depo Charváty)' },
            { id: 'Q', type: 2, title: 'Doručeno' }
        ];

        const TARGET_QR_TEXT = "NTSDelivery-467M";

        let dbStatuses = {};
        let currentActiveStep = null;
        let selectedFormattedDateTime = "";
        let html5QrCode = null;
        let isProcessingQr = false;
        let fpInstance = null;

        // DOM Elementy
        const overviewScreen = document.getElementById('overview-screen');
        const actionScreen = document.getElementById('action-screen');
        const loadingState = document.getElementById('loading-state');
        const statusListEl = document.getElementById('status-list');
        const btnNewStatus = document.getElementById('btn-new-status');

        const actionHeading = document.getElementById('action-heading');
        const manualSection = document.getElementById('manual-section');
        const qrSection = document.getElementById('qr-section');
        const allDoneSection = document.getElementById('all-done-section');

        const chkCompleted = document.getElementById('chk-completed');
        const datetimeContainer = document.getElementById('datetime-container');
        const datetimePickerInput = document.getElementById('datetime-picker-input');
        const btnSaveManual = document.getElementById('btn-save-manual');
        const btnCancelManual = document.getElementById('btn-cancel-manual');

        const qrActiveArea = document.getElementById('qr-active-area');
        const qrWarningMsg = document.getElementById('qr-warning-msg');
        const qrSuccessArea = document.getElementById('qr-success-area');
        const btnCancelQr = document.getElementById('btn-cancel-qr');
        const btnAllDone = document.getElementById('btn-all-done');

        // Pomocná funkce: Formátování data do tvaru "den.měsíc, hodina:minuta"
        function formatDateTimeObj(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const hours = String(dateObj.getHours()).padStart(2, '0');
            const minutes = String(dateObj.getMinutes()).padStart(2, '0');
            return `${day}.${month}, ${hours}:${minutes}`;
        }

        // Inicializace kalendáře Flatpickr (funguje spolehlivě na PC i mobilu po kliknutí do pole)
        fpInstance = flatpickr(datetimePickerInput, {
            locale: "cs",
            enableTime: true,
            time_24hr: true,
            dateFormat: "d.m, H:i",
            disableMobile: true, // Zajistí identický kalendář a přesný formát i na mobilech
            onChange: function(selectedDates, dateStr) {
                if (selectedDates.length > 0) {
                    selectedFormattedDateTime = formatDateTimeObj(selectedDates[0]);
                    datetimePickerInput.value = selectedFormattedDateTime;
                    if (chkCompleted.checked) {
                        btnSaveManual.classList.remove('hidden');
                    }
                } else {
                    selectedFormattedDateTime = "";
                    btnSaveManual.classList.add('hidden');
                }
            }
        });

        // Poslech změn v databázi v reálném čase (nikdy nepřepisuje existující stavy při načtení)
        onValue(statusesRef, (snapshot) => {
            dbStatuses = snapshot.val() || {};
            loadingState.classList.add('hidden');
            statusListEl.classList.remove('hidden');
            btnNewStatus.classList.remove('hidden');
            renderStatusOverview();
        });

        // Vykreslení přehledu stavů na hlavní admin obrazovce
        function renderStatusOverview() {
            statusListEl.innerHTML = '';
            STEPS.forEach(step => {
                const record = dbStatuses[step.id];
                const isCompleted = record && record.completed === true;

                const item = document.createElement('div');
                item.className = `status-item ${isCompleted ? 'completed' : ''}`;

                item.innerHTML = `
                    <div class="status-icon">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                    <div class="status-text">${step.title}</div>
                    ${isCompleted && record.datetime ? `<div class="status-time-badge">${record.datetime}</div>` : ''}
                `;
                statusListEl.appendChild(item);
            });
        }

        // Levenshteinova vzdálenost pro povolení 1 nerozpoznaného písmene u QR kódu
        function isQrCodeValid(scannedText) {
            if (!scannedText) return false;
            const cleanScanned = scannedText.trim();
            if (cleanScanned === TARGET_QR_TEXT) return true;

            if (Math.abs(cleanScanned.length - TARGET_QR_TEXT.length) > 1) return false;

            const a = cleanScanned;
            const b = TARGET_QR_TEXT;
            const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length] <= 1;
        }

        // Otevření obrazovky pro zadání nového stavu
        btnNewStatus.addEventListener('click', () => {
            // Najdeme první nevyřízený stav v pořadí A -> Q
            currentActiveStep = STEPS.find(s => !(dbStatuses[s.id] && dbStatuses[s.id].completed === true));

            overviewScreen.classList.add('hidden');
            actionScreen.classList.remove('hidden');

            manualSection.classList.add('hidden');
            qrSection.classList.add('hidden');
            allDoneSection.classList.add('hidden');

            // Pokud jsou již všechny stavy až po Q vyřízeny
            if (!currentActiveStep) {
                actionHeading.textContent = 'Zásilka doručena';
                allDoneSection.classList.remove('hidden');
                return;
            }

            // Nastavení nadpisu podle prvního nevyřízeného stavu
            actionHeading.textContent = currentActiveStep.title;

            if (currentActiveStep.type === 1) {
                setupManualEntry();
            } else if (currentActiveStep.type === 2) {
                setupQrScannerEntry();
            }
        });

        // Nastavení manuálního zadání (*1*)
        function setupManualEntry() {
            manualSection.classList.remove('hidden');
            chkCompleted.checked = false;
            selectedFormattedDateTime = "";
            if (fpInstance) {
                fpInstance.clear();
            }
            datetimePickerInput.value = "";
            datetimeContainer.classList.add('hidden');
            btnSaveManual.classList.add('hidden');
        }

        chkCompleted.addEventListener('change', () => {
            if (chkCompleted.checked) {
                datetimeContainer.classList.remove('hidden');
                if (selectedFormattedDateTime) {
                    btnSaveManual.classList.remove('hidden');
                }
            } else {
                datetimeContainer.classList.add('hidden');
                btnSaveManual.classList.add('hidden');
                if (fpInstance) {
                    fpInstance.close();
                }
            }
        });

        // Uložení manuálního stavu (*1*)
        btnSaveManual.addEventListener('click', async () => {
            if (!currentActiveStep || !chkCompleted.checked || !selectedFormattedDateTime) return;

            btnSaveManual.disabled = true;
            btnSaveManual.textContent = 'Ukládám...';

            const stepIndex = STEPS.findIndex(s => s.id === currentActiveStep.id);

            await set(ref(db, `shipments/837-682-405/statuses/${currentActiveStep.id}`), {
                id: currentActiveStep.id,
                completed: true,
                datetime: selectedFormattedDateTime,
                savedAt: Date.now(),
                orderIndex: stepIndex
            });

            btnSaveManual.disabled = false;
            btnSaveManual.textContent = 'Uložit';
            returnToOverview();
        });

        // Nastavení čtečky QR kódů (*2*)
        async function setupQrScannerEntry() {
            qrSection.classList.remove('hidden');
            qrActiveArea.classList.remove('hidden');
            qrSuccessArea.classList.add('hidden');
            qrWarningMsg.classList.add('hidden');
            isProcessingQr = false;

            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch (e) {}
            }

            html5QrCode = new Html5Qrcode("qr-reader");
            const config = {
                fps: 15,
                qrbox: { width: 240, height: 240 },
                aspectRatio: 1.0
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onQrCodeScanSuccess,
                    () => {
                        // Kamera míří mimo QR kód - tiše čeká dál
                    }
                );
            } catch (err) {
                // Fallback na přední/jakoukoliv kameru, pokud zadní není dostupná
                try {
                    await html5QrCode.start(
                        { facingMode: "user" },
                        config,
                        onQrCodeScanSuccess,
                        () => {}
                    );
                } catch (err2) {
                    console.error("Nelze spustit kameru:", err2);
                }
            }
        }

        async function onQrCodeScanSuccess(decodedText) {
            if (isProcessingQr) return;

            if (isQrCodeValid(decodedText)) {
                isProcessingQr = true;
                qrWarningMsg.classList.add('hidden');

                // Zastavíme kameru a zobrazíme zelenou fajfku na 5 sekund
                if (html5QrCode) {
                    try { await html5QrCode.stop(); } catch (e) {}
                }

                qrActiveArea.classList.add('hidden');
                qrSuccessArea.classList.remove('hidden');

                const nowFormatted = formatDateTimeObj(new Date());
                const stepIndex = STEPS.findIndex(s => s.id === currentActiveStep.id);

                // Uložení stavu a aktuálního data a času do Firebase během 5s intervalu
                await set(ref(db, `shipments/837-682-405/statuses/${currentActiveStep.id}`), {
                    id: currentActiveStep.id,
                    completed: true,
                    datetime: nowFormatted,
                    savedAt: Date.now(),
                    orderIndex: stepIndex
                });

                setTimeout(() => {
                    returnToOverview();
                }, 5000);

            } else {
                // Neplatný QR kód - zobrazíme červené tučné varování
                qrWarningMsg.classList.remove('hidden');
            }
        }

        // Návrat na přehled stavů (Storno / Hotovo / Dokončení)
        async function returnToOverview() {
            if (fpInstance) {
                fpInstance.close();
            }
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (e) {}
                html5QrCode = null;
            }
            actionScreen.classList.add('hidden');
            overviewScreen.classList.remove('hidden');
            currentActiveStep = null;
        }

        btnCancelManual.addEventListener('click', returnToOverview);
        btnCancelQr.addEventListener('click', returnToOverview);
        btnAllDone.addEventListener('click', returnToOverview);
    </script>
</body>
